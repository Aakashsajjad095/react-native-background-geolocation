
buildscript {
    repositories {
        maven {
            url 'https://maven.google.com/'
            name 'Google'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.1'
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven { url "$rootDir/../node_modules/react-native/android" } // For react-native local artifacts
        google() // Google's Maven repository
        mavenCentral() // Maven Central repository
        mavenCentral()
        // repo for react-native
        // https://mvnrepository.com/artifact/com.facebook.react/react-native?repo=springio-plugins-release

    }
}



ext {
    reactNativeLibVersion = "0.71.0-rc.0"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}